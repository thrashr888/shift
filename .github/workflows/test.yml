name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TERM: xterm-256color
      SHIFT_PLUGINS: "off"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Guile and ripgrep
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q guile-3.0 ripgrep
          guile --version | head -1
      - name: Run the suite
        run: make test
